name: BOTW iOS Build Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check macOS and Xcode
        run: |
          set -eu
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install required tools
        run: |
          set -eu
          brew install xcodegen cmake ninja opus libvpx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install -r games/totk/requirements.txt

      - name: Check build entry point and BOTW assets
        run: |
          set -eu
          python build_app.py --help
          test -f games/totk/ios/tools/build_ipa.py
          test -f games/botw/assets/expected-v1.9.0.json
          test -f games/botw/assets/shader_list.tsv
          echo "BOTW 1.9.0 build metadata is present."

      - name: Check available disk space
        run: |
          df -h "$GITHUB_WORKSPACE"
          df -h "$RUNNER_TEMP"
